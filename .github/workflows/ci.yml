name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build:packages
      - name: Generate Prisma client
        run: pnpm --filter @elm-platform/server run prisma:generate
      - name: Build server
        run: pnpm --filter @elm-platform/server run build
      - name: Build web-admin
        run: pnpm --filter @elm-platform/web-admin run build
      - name: Build web-user
        run: pnpm --filter @elm-platform/web-user run build
      - name: Type check
        run: pnpm type-check
      - name: Test server
        run: pnpm --filter @elm-platform/server run test
      - name: Test web-admin
        run: pnpm --filter @elm-platform/web-admin run test:unit
      - name: Test web-user
        run: pnpm --filter @elm-platform/web-user run test

  api-drift:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build:packages
      - name: Generate Prisma client
        run: pnpm --filter @elm-platform/server run prisma:generate
      - name: Run production database migrations
        run: pnpm --filter @elm-platform/server run prisma:migrate:prod
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/elm_test?schema=public
      - name: Seed database
        run: pnpm --filter @elm-platform/server run prisma:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/elm_test?schema=public
      - name: Start server
        run: pnpm --filter @elm-platform/server run start &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/elm_test?schema=public
          APP_PORT: 3000
          APP_PREFIX: api
      - name: Wait for server ready
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3000/api-docs-json > /dev/null && break
            sleep 1
          done
      - name: Generate API types
        run: pnpm api:generate
      - name: Check API types drift
        run: |
          if ! git diff --quiet packages/api-types/; then
            echo "::error::API types are out of date. Run 'pnpm api:generate' locally and commit packages/api-types/."
            git diff packages/api-types/
            exit 1
          fi
          echo "API types are up to date."
