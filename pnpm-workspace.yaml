allowBuilds:
  '@compodoc/compodoc': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  # core-js / core-js-pure 的 postinstall 只打印 OpenCollective 捐赠横幅
  # （脚本自身检测 CI/ADBLOCK/DISABLE_OPENCOLLECTIVE 即跳过），无功能作用 → 不批准。
  # 二者由 @dcloudio/vite-plugin-uni 的传递依赖引入（core-js 3.50.0）。
  core-js: false
  core-js-pure: false
  esbuild: true
  prisma: true
  ttf2woff2: true
  # vue-demi 的 postinstall 会按实际 vue 版本 switchVersion()，切换 lib 产物指向
  # Vue2/Vue3 实现 → 有功能作用，批准。pinia 2.x 依赖它；
  # uni-user 的 vue 是 3.4.21，发布产物默认已是 isVue3=true，批准可避免边界情况下留在 v2 占位。
  vue-demi: true
