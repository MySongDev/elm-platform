shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar
  - semver
  - undici-types
  # @dcloudio/vite-plugin-uni 精确锁 @vitejs/plugin-legacy@5.3.2（传递依赖）。
  # pnpm 信任策略按发布日期比对：5.0.0-beta.0/beta.1（2023-09）带 SLSA provenance，
  # 其后 5.0.0-beta.2 至 5.4.3 连续 10 个正式版均无 → Vite 官方短暂启用后停用，6.1.0 才重启，
  # 属发布流程变化而非单版本被接管。已核实 5.3.2 的 maintainers 全为 Vite 官方成员
  # （soda / vitebot / yyx990803 / patak / antfu）。5.x 全线无 attestation，
  # 故无「升级到同 major 的有证据版本」这条退路；6.x 需 vite 6，与 uni-app 锁的 5.2.8 不兼容。
  - '@vitejs/plugin-legacy'

packages:
  - apps/server
  - apps/uni-user
  - apps/web-admin
  - apps/web-user
  - 'packages/*'

overrides:
  braces@<3.0.3: 3.0.3
  glob@>=10.2.0 <10.5.0: 10.5.0
  lodash@>=4.0.0 <=4.17.23: 4.18.1
